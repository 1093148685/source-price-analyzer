{% extends 'base.html' %}{% block title %}AI 配置 - 链动货源价格{% endblock %}{% block body %}<main class="wrap"><section class="section"><h2>AI 分类配置</h2><p class="muted">用于把商品标题/描述归纳成稳定的产品套餐。未启用或无 key 时使用规则兜底；密钥只保存在服务器本地，不在页面回显。</p><form class="card form" method="post" action="/settings"><label class="check"><input type="checkbox" name="enabled" {% if cfg.enabled %}checked{% endif %}> 启用 AI 辅助分类</label><label>OpenAI-compatible Base URL<input name="base_url" value="{{cfg.base_url}}" placeholder="https://api.example.com/v1"></label><label>模型名称<input name="model" value="{{cfg.model}}" placeholder="gpt-4o-mini / claude...兼容模型"></label><label>API Key<input name="api_key" type="password" placeholder="{% if cfg.api_key_masked %}已保存：{{cfg.api_key_masked}}{% else %}留空则不修改{% endif %}"></label><div class="twocol"><label>Temperature<input name="temperature" type="number" step="0.1" min="0" max="1" value="{{cfg.temperature}}"></label><label>Batch Size<input name="batch_size" type="number" min="1" max="100" value="{{cfg.batch_size}}"></label></div><label>模式<select name="mode"><option value="rules-first" {% if cfg.mode=='rules-first' %}selected{% endif %}>规则优先，AI 处理待归类</option><option value="ai-first" {% if cfg.mode=='ai-first' %}selected{% endif %}>AI 优先，规则兜底</option></select></label><button class="btn primary" type="submit">保存配置</button></form></section><section class="section"><h2>分类目标</h2><div class="grid"><div class="card"><h3>产品类型</h3><p class="muted">ChatGPT / Claude / Grok 等一级入口。</p></div><div class="card"><h3>具体产品</h3><p class="muted">Plus 官方充值、Plus 成品号、Pro 代充、Free 账号等。</p></div><div class="card"><h3>同品比价</h3><p class="muted">同一个具体产品下，按店铺聚合最低价、库存和报价数。</p></div></div></section></main>{% endblock %}
